<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Exercise</title>
</head>

<body>
    <section>
        <div class="cube">
            <figure>
                <video src="./video/cube.mp4" autoplay muted loop alt></video>
            </figure>
        </div>
    </section>
    <div id="footer">
        <a href="../index.html">BACK</a>
    </div>
    <style>
        body {
            background-color: rgb(0, 0, 0);
        }

        p {
            text-align: center;
            color: darkgray;
            margin: 2rem;
        }

        a {
            color: aliceblue;
            text-align: center;
            font-size: 128;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        a:hover {
            color: rgb(255, 0, 0);
        }

        #footer {
            text-align: center;
            object-fit: cover;
            min-height: 100px;
        }

        #wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin: 0.1rem;
            align-items: center;
        }

        figure video {
            width: 100%;
            object-fit: cover;
        }

        h1 {
            text-align: center;
            color: aliceblue;
            padding: 2rem;
            background-color: black;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        @media screen and (max-width: 600px) {
            body {
                background-attachment: fixed;
            }

            #wrapper {
                grid-template-columns: 1fr;
                padding: 0 1.2rem;
            }

            .scroll_down {
                display: none;
            }

            header {
                min-height: auto;
            }

            figure video {
                width: 100%;
            }
        }
    </style>
</body>

</html>
