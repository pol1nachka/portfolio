<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infographic</title>
    <link rel="stylesheet" href="./info.css">
</head>

<body>
    <h1>A&W infographic</h1>
    <div class="wrapper">
        <figure>
            <iframe src="https://youtube.com/embed/0MDCgNi6-_A?" title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <figcaption>Infographic animation</figcaption>
        </figure>
        <h1>STORYBOARD</h1>
        <figure>
            <img src="./img/Screenshot 2024-10-15 at 11.30.47 AM.png" alt="">
        </figure>
        <h1>DESCRIPTION</h1>
        <figure>
            <p>Since the company I chose is A&W for my Layout class, I decided to do a banner-like animation. I took my
                already made infographic and animated it, making things appear smoothly with fade in. I also kept things
                dynamic by making the burgers "shake" and the arrows to move up and down. I used the A&W color palette
                and played around to make things visually balanced. I used farm like music, since A&W promotes naturally
                raised cows on Canadian farms.
                <br>
                The text is barely the right size, because there is a lot to read. It is the first time I did something
                like this, and I am pretty satisfied with the result :)
            </p>
        </figure>
    </div>
    <footer>
        <a href="./index.html">BACK</a>
    </footer>
</body>
